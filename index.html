<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071126"><link rel="manifest" href="manifest.webmanifest"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Mr.TIẾN"><title>APTV Drive</title><link rel="stylesheet" href="styles.css?v=20261003mobile4"><link rel="stylesheet" href="home-polish.css?v=20261003fit3"></head><body><div class="shell"><div id="driveHome" class="drive-home">
  <aside class="home-rail"><div class="home-logo" style="padding:4px;background:transparent"><img src="assets/evn-logo.svg" alt="EVN" style="width:100%;height:100%;object-fit:contain;display:block"></div><strong id="homeClock">--:--</strong><div class="rail-spacer"></div><a class="rail-btn focusable" href="map.html">⌖<span>Map</span></a><a href="cartube.html" class="rail-btn focusable">▣<span>CarTube</span></a><button id="homeFit" class="rail-btn focusable">⛶<span>Fit 90%</span></button></aside>
  <section class="home-main"><header class="home-head"><button class="home-square focusable">♩</button><div class="home-title"><small>Mr.TIẾN</small><b>Giải trí</b></div><button id="driveModeBtn" class="home-activate focusable">🚘 Chế độ lái</button><button id="voiceHomeBtn" class="home-square focusable" aria-label="Lệnh giọng nói" title="Lệnh giọng nói">🎙</button></header>
  <div class="service-stack"><a href="youtube.html" id="homeYouTube" class="service-card youtube-card focusable" style="text-decoration:none"><span class="service-kicker">VIDEO · ĐỒNG HỒ · GPS</span><span class="service-open">↗</span><span class="service-icon youtube-service">▶</span><span class="service-name">YouTube</span><span class="service-arrow">→</span></a>
  <a href="tv.html" id="homeTV" class="service-card tv-card focusable" style="text-decoration:none"><span class="service-kicker">TV · IPTV</span><span class="service-open">↗</span><span class="service-icon tv-service">▣</span><span class="service-name">Truyền hình</span><span class="service-arrow">→</span></a></div>
  <div class="welcome-strip">
  <div class="welcome-audio"><button id="welcomeBtn" class="welcome-btn focusable"><span id="welcomeAudioIcon" class="welcome-icon" title="Phát / tắt âm thanh">🔊</span><span><small>CHÀO QUÝ KHÁCH</small><b id="welcomeText">Nhấn để phát lời chào</b></span></button></div>
  <div class="welcome-scenes">
    <button class="welcome-scene focusable active" data-scene="welcome">👋 Kính chào quý khách</button>
    <button class="welcome-scene focusable" data-scene="seatbelt">👨 Lên xe giọng nam</button>
    <button class="welcome-scene focusable" data-scene="morning">👩 Lên xe giọng nữ</button>
    <button class="welcome-scene focusable" data-scene="trip">🛡 Thắt dây an toàn</button>
    <button class="welcome-scene focusable" data-scene="wish">👋 Xin chào cậu chủ</button>
  </div>
</div><div class="home-links">Mr.TIẾN Smart Cockpit · CarTube · TV · GPS</div></section>
</div>
</div><div id="miniMediaBar" class="mini-media hidden"><a id="miniMediaOpen" class="mini-media-main focusable" href="youtube.html"><span>▶</span><span><small>VIDEO GẦN ĐÂY</small><b id="miniMediaTitle">Chưa có video</b></span></a><button id="miniMediaClose" class="mini-media-close focusable">×</button></div><script>
(function(){
  function tick(){var e=document.getElementById("homeClock");if(e)e.textContent=new Date().toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})}
  tick();setInterval(tick,30000);

  var fit=document.getElementById("homeFit");
  if(fit){
    var fitLevels=[1,.9,.8],fitIndex=0;
    try{var saved=parseFloat(localStorage.getItem("aptvHomeFit")||"1");var found=fitLevels.indexOf(saved);if(found>=0)fitIndex=found}catch(e){}
    function applyFit(){var z=fitLevels[fitIndex];document.body.style.zoom=String(z);fit.querySelector("span").textContent="Fit "+Math.round(z*100)+"%";try{localStorage.setItem("aptvHomeFit",String(z))}catch(e){}}
    applyFit();
    fit.onclick=function(){fitIndex=(fitIndex+1)%fitLevels.length;applyFit()};
  }

  var recent=document.getElementById("recentMedia");
  try{
    var h=JSON.parse(localStorage.getItem("aptvHistory")||"[]");
    if(recent&&h[0])recent.textContent=h[0].title||"Video gần đây";
    var now=JSON.parse(localStorage.getItem("aptvNowPlaying")||"null"),bar=document.getElementById("miniMediaBar"),mt=document.getElementById("miniMediaTitle"),mo=document.getElementById("miniMediaOpen");if(now&&now.id&&bar&&mt){mt.textContent=now.title||"Video YouTube";if(mo)mo.href="youtube.html?video="+encodeURIComponent(now.id);bar.classList.remove("hidden")}
  }catch(e){}

  var driveBtn=document.getElementById("driveModeBtn"), state=document.getElementById("driveModeState");
  function applyDrive(on){
    document.body.classList.toggle("home-driving-mode",!!on);
    localStorage.setItem("aptvDrivingMode",on?"1":"0");
    if(state)state.textContent=on?"Đang bật · nút lớn":"Chế độ thường";
    if(driveBtn)driveBtn.textContent=on?"✓ Đang lái":"🚘 Chế độ lái";
  }
  applyDrive(localStorage.getItem("aptvDrivingMode")==="1");
  if(driveBtn)driveBtn.onclick=function(){applyDrive(!document.body.classList.contains("home-driving-mode"))};

  var voice=document.getElementById("voiceHomeBtn");
  if(voice)voice.onclick=function(){
    var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(!SR){alert("Trình duyệt này chưa hỗ trợ lệnh giọng nói.");return}
    var r=new SR();r.lang="vi-VN";r.interimResults=false;r.maxAlternatives=1;
    voice.classList.add("listening");voice.textContent="●";
    r.onend=function(){voice.classList.remove("listening");voice.textContent="🎙"};
    r.onerror=function(){voice.classList.remove("listening");voice.textContent="🎙"};
    r.onresult=function(ev){
      var s=(ev.results[0][0].transcript||"").toLowerCase();
      if(s.includes("youtube")||s.includes("nhạc")||s.includes("car tube")||s.includes("cartube"))location.href="cartube.html";
      else if(s.includes("tivi")||s.includes("tv")||s.includes("truyền hình"))location.href="tv.html";
      else if(s.includes("bản đồ")||s.includes("map")||s.includes("đường đi"))location.href="https://www.google.com/maps";
      else if(s.includes("chế độ lái"))applyDrive(true);
      else alert("Chưa nhận ra lệnh: "+s);
    };
    r.start();
  };

  var deferredPrompt=null, install=document.getElementById("installAppBtn");
  window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferredPrompt=e;if(install)install.classList.remove("hidden")});
  if(install)install.onclick=async function(){if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;install.classList.add("hidden")};

  var mc=document.getElementById("miniMediaClose");if(mc)mc.onclick=function(){localStorage.removeItem("aptvNowPlaying");var b=document.getElementById("miniMediaBar");if(b)b.classList.add("hidden")};

  if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();

(function(){
 var scene='welcome',player=new Audio(),audioMap={
  welcome:'assets/Audio/Kính chào quý khách.mp3',
  seatbelt:'assets/Audio/Lên xe giọng nam.mp3',
  morning:'assets/Audio/Lên xe giọng nữ.mp3',
  trip:'assets/Audio/Lên xe thắt dây an toàn.mp3',
  wish:'assets/Audio/Xin chào cậu chủ.mp3'
 },labels={
  welcome:'Kính chào quý khách',
  seatbelt:'Lên xe · giọng nam',
  morning:'Lên xe · giọng nữ',
  trip:'Lên xe · thắt dây an toàn',
  wish:'Xin chào cậu chủ'
 };
 player.preload='auto';
 function playScene(){
  var src=audioMap[scene];if(!src)return;
  try{if(window.speechSynthesis)window.speechSynthesis.cancel()}catch(x){}
  player.pause();player.currentTime=0;player.src=encodeURI(src);player.load();
  var p=player.play();if(p&&p.catch)p.catch(function(){var wt=document.getElementById('welcomeText');if(wt)wt.textContent='Không phát được âm thanh'});
 }
 player.onplay=function(){if(ico)ico.textContent='🔊'};player.onended=function(){if(ico)ico.textContent='🔇';var wt=document.getElementById('welcomeText');if(wt)wt.textContent=labels[scene]};
 var b=document.getElementById('welcomeBtn'),ico=document.getElementById('welcomeAudioIcon');
 function stopAudio(){player.pause();player.currentTime=0;if(ico)ico.textContent='🔇';var wt=document.getElementById('welcomeText');if(wt)wt.textContent='Đã tắt âm thanh'}
 function startAudio(){playScene();if(ico)ico.textContent='🔊'}
 if(b)b.onclick=function(ev){if(ev&&ev.target===ico){if(!player.paused)stopAudio();else startAudio()}else startAudio()};
 var bs=document.querySelectorAll('.welcome-scene');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){
  scene=this.getAttribute('data-scene');
  for(var k=0;k<bs.length;k++)bs[k].classList.remove('active');
  this.classList.add('active');
  var wt=document.getElementById('welcomeText');if(wt)wt.textContent=labels[scene];
  playScene();
 };
})();</script></body></html>
